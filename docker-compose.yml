services:
  web:
    build:
      context: .
    ports:
      - "8000:8000"
    volumes:
      - ./src:/app
    env_file:
      - .env
    command: >
      sh -c "python manage.py runserver 0.0.0.0:8000"
    depends_on:
      - database #это имя должно быть одинаковым в .env файле

  database: #это имя должно быть одинаковым в .env файле
   image: postgres:15-alpine
   environment:
     POSTGRES_DB: ${DB_NAME}
     POSTGRES_USER: ${DB_USER}
     POSTGRES_PASSWORD: ${DB_PASSWORD}
#   ports:
#     - "5432:5432"
#
#   volumes:
#     - postgres_data:/var/lib/postgresql/data
  bot:
    build:
      context: .
    volumes:
      - ./src:/app
    env_file:
      - .env
    command: python bot/main.py
    depends_on:
      - database
    dns:
      - 8.8.8.8
      - 8.8.4.4